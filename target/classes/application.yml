spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/jitterdb
    username: jitter
    password: jitter
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 50
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

logging:
  level:
    com.example.jitterbackoff: INFO
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
