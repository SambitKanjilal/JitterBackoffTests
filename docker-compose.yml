services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jitterdb
      POSTGRES_USER: jitter
      POSTGRES_PASSWORD: jitter
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jitter -d jitterdb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
